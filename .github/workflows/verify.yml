name: 独立构建检查
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
      - name: 干净安装并生成入口
        run: pnpm install --frozen-lockfile
      - name: 验证核心逻辑及客户端产物
        run: pnpm test
      - name: 验证分发文件
        run: pnpm pack
